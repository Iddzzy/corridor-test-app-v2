<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corridor Test Pro Suite</title>
    <style>
        :root { 
            --primary: #2563eb; 
            --danger: #ef4444; 
            --success: #10b981; 
            --dark: #1e293b; 
            --light-bg: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        body { 
            font-family: 'Inter', -apple-system, system-ui, sans-serif; 
            margin: 0; background: var(--light-bg); background-attachment: fixed;
            color: var(--dark); min-height: 100vh;
        }

        .view { display: none; padding: 20px; max-width: 550px; margin: auto; animation: fadeIn 0.3s ease; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { 
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px);
            padding: 20px; border-radius: 16px; box-shadow: var(--card-shadow); 
            margin-bottom: 15px; border: 1px solid rgba(255, 255, 255, 0.5);
        }

        button { 
            padding: 16px; font-weight: 600; border: none; border-radius: 12px; 
            color: white; cursor: pointer; margin: 8px 0; width: 100%; font-size: 1rem; 
            transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        button:active { transform: scale(0.97); }
        .btn-main { background: var(--primary); }
        .btn-alt { background: var(--dark); }
        .btn-danger { background: var(--danger); }
        .btn-success { background: var(--success); }
        .btn-back { background: transparent; color: var(--dark); border: 1px solid #cbd5e1; margin-bottom: 15px; }

        input, textarea, select { 
            width: 100%; padding: 14px; margin: 8px 0; border: 1px solid #e2e8f0; 
            border-radius: 12px; font-size: 16px; background: white;
        }

        .choice-row {
            display: flex; align-items: center; justify-content: flex-start; 
            gap: 12px; padding: 12px; background: white; border-radius: 10px;
            margin: 8px 0; border: 1px solid #eee; cursor: pointer;
        }
        .choice-row input { width: 20px; height: 20px; margin: 0; flex-shrink: 0; }

        .sticky-controls {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px);
            box-shadow: 0 -5px 20px rgba(0,0,0,0.05); padding: 15px 20px 30px;
            box-sizing: border-box; z-index: 1000; border-top: 1px solid #eee;
        }
        .footer-spacer { height: 180px; }

        #timer-display { 
            background: var(--dark); color: white; padding: 10px 20px; 
            border-radius: 30px; font-family: monospace; font-size: 1.4rem; 
            margin: 10px auto; width: fit-content; text-align: center;
        }
        .blink { color: var(--danger); animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: 0.2; } }
    </style>
</head>
<body>

<!-- HOME -->
<div id="view-main" class="view active">
    <h1>Corridor Test Suite</h1>
    <div class="card">
        <button class="btn-main" onclick="showView('view-projects-start')">Start Corridor Test</button>
        <button class="btn-alt" onclick="showView('view-settings')">List Of Project</button>
        <button class="btn-success" onclick="showView('view-reports')">Record</button>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <button style="background: #64748b;" onclick="showView('view-logs')">Log</button>
        <button style="background: #94a3b8;" onclick="showView('view-summary')">Summary</button>
    </div>
</div>

<!-- LIST OF PROJECT -->
<div id="view-settings" class="view">
    <button class="btn-back" onclick="showView('view-main')">← Back Home</button>
    <h2>List Of Project</h2>
    <div id="project-list"></div>
    <button class="btn-success" onclick="prepareNewProject()">+ Add New Project</button>
</div>

<!-- PROJECT EDITOR -->
<div id="view-editor" class="view">
    <button class="btn-back" onclick="showView('view-settings')">← Cancel</button>
    <h2 id="editor-head">Project Editor</h2>
    <input type="text" id="proj-name" placeholder="Project Name">
    <div class="card">
        <h4 id="q-editor-mode" style="margin:0;">Add/Edit Question</h4>
        <input type="text" id="q-text" placeholder="Question Text">
        <select id="q-type" onchange="toggleOptionsUI()">
            <option value="text">Plain Text</option>
            <option value="radio">Radio Button</option>
            <option value="checkbox">Checkbox</option>
        </select>
        <div id="options-setup" style="display:none; margin-top:10px;">
            <div id="options-list"></div>
            <button class="btn-alt" style="padding:8px; font-size:0.8rem; width:auto;" onclick="addOptionInput()">+ Add Option</button>
        </div>
        <button id="add-q-btn" class="btn-main" onclick="addOrUpdateQuestion()" style="margin-top:15px;">Save Question to List</button>
    </div>
    <div id="questions-preview"></div>
    <button class="btn-success" onclick="saveProject()">Finalize & Save Project</button>
</div>

<!-- CHOOSE PROJECT LIST -->
<div id="view-projects-start" class="view">
    <button class="btn-back" onclick="showView('view-main')">← Back Home</button>
    <h2>Choose Project</h2>
    <div id="start-project-list"></div>
</div>

<!-- INTERVIEW INTERFACE -->
<div id="view-interview" class="view" style="padding-bottom: 0;">
    <button class="btn-back" onclick="showView('view-projects-start')">← Back to Projects</button>
    <h3 id="active-p-name" style="text-align:center;"></h3>
    <div id="timer-display">00:00:00</div>
    <div id="recordStatus" style="text-align:center; font-weight:bold; font-size:0.8rem; margin-bottom:10px;">Ready</div>
    <div id="interview-questions"></div>
    <div class="footer-spacer"></div>
    <div class="sticky-controls">
        <div style="display:flex; gap:10px;">
            <button id="btnRecStart" class="btn-danger" onclick="startAudio()">⏺ Start Now</button>
            <button id="btnRecStop" class="btn-alt" onclick="stopAudio()" disabled>⏹ Stop</button>
        </div>
        <button class="btn-success" onclick="finishInterview()">💾 Save & Download Session</button>
    </div>
</div>

<!-- THANK YOU PAGE -->
<div id="view-thanks" class="view">
    <div class="card" style="text-align:center; padding:60px 20px;">
        <h1 style="color:var(--success); font-size:3rem; margin:0;">✔</h1>
        <h2>Finished!</h2>
        <p>Your session records have been downloaded.</p>
        <button class="btn-main" onclick="showView('view-main')">Return Home</button>
    </div>
</div>

<!-- RECORD, LOG, SUMMARY -->
<div id="view-reports" class="view"> <button class="btn-back" onclick="showView('view-main')">← Back</button> <h2>Record</h2> <div id="reports-list"></div> </div>
<div id="view-logs" class="view"> <button class="btn-back" onclick="showView('view-main')">← Back</button> <h2>Log</h2> <div id="logs-list"></div> </div>
<div id="view-summary" class="view"> <button class="btn-back" onclick="showView('view-main')">← Back</button> <h2>Summary</h2> <div id="summary-content"></div> </div>

<script>
    // --- Global State ---
    let projects = JSON.parse(localStorage.getItem('ct_projects')) || [];
    let reports = JSON.parse(localStorage.getItem('ct_reports')) || [];
    let logs = JSON.parse(localStorage.getItem('ct_logs')) || [];
    let currentEditProjIdx = -1;
    let currentEditQuesIdx = -1;
    let tempProject = { name: '', questions: [] };
    let mediaRecorder;
    let audioChunks = [];
    let startTime, timerInterval, elapsedSeconds = 0;
    let activeProjectQuestions = [];

    // --- Navigation ---
    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'view-settings') renderProjectList();
        if(id === 'view-projects-start') renderStartList();
        if(id === 'view-reports') renderReports();
        if(id === 'view-logs') renderLogs();
        if(id === 'view-summary') renderSummary();
        if(id !== 'view-interview') resetTimer();
        window.scrollTo(0,0);
    }

    function addLog(msg) {
        logs.unshift(`[${new Date().toLocaleString()}] ${msg}`);
        localStorage.setItem('ct_logs', JSON.stringify(logs.slice(0, 50)));
    }

    // --- Audio Logic ---
    async function startAudio() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
            mediaRecorder.start();
            startTimer();
            document.getElementById('recordStatus').innerText = "● RECORDING";
            document.getElementById('recordStatus').classList.add('blink');
            document.getElementById('btnRecStart').disabled = true;
            document.getElementById('btnRecStop').disabled = false;
        } catch (err) { alert("Mic access denied."); }
    }

    function stopAudio() {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
            stopTimer();
            document.getElementById('recordStatus').innerText = "Stopped";
            document.getElementById('recordStatus').classList.remove('blink');
            document.getElementById('btnRecStart').disabled = false;
            document.getElementById('btnRecStop').disabled = true;
        }
    }

    // --- Timer Logic ---
    function startTimer() {
        startTime = Date.now() - (elapsedSeconds * 1000);
        timerInterval = setInterval(() => {
            elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById('timer-display').innerText = formatTime(elapsedSeconds);
        }, 1000);
    }
    function stopTimer() { clearInterval(timerInterval); }
    function resetTimer() { 
        stopTimer(); 
        elapsedSeconds = 0; 
        if(document.getElementById('timer-display')) document.getElementById('timer-display').innerText = "00:00:00";
    }
    function formatTime(s) { return new Date(s * 1000).toISOString().substr(11, 8); }

    // --- Project Management Functions ---
    function renderProjectList() {
        document.getElementById('project-list').innerHTML = projects.map((p, i) => `
            <div class="card">
                <b>${p.name}</b><div style="display:flex; gap:5px; margin-top:10px;">
                <button class="btn-main" onclick="editProject(${i})">Edit</button>
                <button class="btn-danger" onclick="deleteProject(${i})">Delete</button></div>
            </div>`).join('') || '<p>No projects.</p>';
    }

    function prepareNewProject() { currentEditProjIdx = -1; tempProject = { name: '', questions: [] }; document.getElementById('proj-name').value = ''; renderEditorPreview(); showView('view-editor'); }
    
    function editProject(i) { 
        currentEditProjIdx = i; 
        tempProject = JSON.parse(JSON.stringify(projects[i])); 
        document.getElementById('proj-name').value = tempProject.name; 
        renderEditorPreview(); 
        showView('view-editor'); 
    }

    function addOrUpdateQuestion() {
        const text = document.getElementById('q-text').value;
        const type = document.getElementById('q-type').value;
        if(!text) return;
        let options = [];
        if(type !== 'text') document.querySelectorAll('.opt-val').forEach(i => { if(i.value) options.push(i.value) });
        
        const qData = { text, type, options, disabled: false };
        
        if(currentEditQuesIdx > -1) {
            // Update existing
            qData.disabled = tempProject.questions[currentEditQuesIdx].disabled;
            tempProject.questions[currentEditQuesIdx] = qData;
            currentEditQuesIdx = -1;
            document.getElementById('add-q-btn').innerText = "Save Question to List";
        } else {
            // New question
            tempProject.questions.push(qData);
        }
        
        renderEditorPreview(); 
        document.getElementById('q-text').value = ''; 
        document.getElementById('options-list').innerHTML = '';
        document.getElementById('options-setup').style.display = 'none';
    }

    function renderEditorPreview() {
        document.getElementById('questions-preview').innerHTML = tempProject.questions.map((q, i) => `
            <div class="card" style="opacity:${q.disabled ? '0.5' : '1'}; border-left: 5px solid ${q.disabled ? '#ccc' : 'var(--primary)'}">
                <div style="margin-bottom:10px;"><b>${i+1}. ${q.text}</b> <small>(${q.type})</small></div>
                <div style="display:flex; gap:5px; flex-wrap:wrap;">
                    <button class="btn-main" style="width:auto; padding:5px 10px; font-size:0.7rem;" onclick="loadQForEdit(${i})">Edit</button>
                    <button class="btn-alt" style="width:auto; padding:5px 10px; font-size:0.7rem;" onclick="moveQ(${i}, -1)">↑ Up</button>
                    <button class="btn-alt" style="width:auto; padding:5px 10px; font-size:0.7rem;" onclick="moveQ(${i}, 1)">↓ Down</button>
                    <button style="width:auto; padding:5px 10px; font-size:0.7rem; background:#64748b;" onclick="toggleQ(${i})">${q.disabled ? 'Enable' : 'Disable'}</button>
                    <button class="btn-danger" style="width:auto; padding:5px 10px; font-size:0.7rem;" onclick="removeQ(${i})">Del</button>
                </div>
            </div>`).join('');
    }

    function loadQForEdit(i) {
        currentEditQuesIdx = i;
        const q = tempProject.questions[i];
        document.getElementById('q-text').value = q.text;
        document.getElementById('q-type').value = q.type;
        toggleOptionsUI();
        document.getElementById('options-list').innerHTML = '';
        if(q.options) q.options.forEach(opt => addOptionInput(opt));
        document.getElementById('add-q-btn').innerText = "Update Question #" + (i+1);
        window.scrollTo(0,0);
    }

    function moveQ(index, dir) {
        let target = index + dir;
        if(target < 0 || target >= tempProject.questions.length) return;
        [tempProject.questions[index], tempProject.questions[target]] = [tempProject.questions[target], tempProject.questions[index]];
        renderEditorPreview();
    }

    function toggleQ(i) { tempProject.questions[i].disabled = !tempProject.questions[i].disabled; renderEditorPreview(); }
    function removeQ(i) { if(confirm("Delete question?")) { tempProject.questions.splice(i,1); renderEditorPreview(); } }

    function saveProject() {
        tempProject.name = document.getElementById('proj-name').value || "Unnamed";
        if(currentEditProjIdx > -1) projects[currentEditProjIdx] = tempProject; else projects.push(tempProject);
        localStorage.setItem('ct_projects', JSON.stringify(projects));
        addLog(`Project Saved: ${tempProject.name}`);
        showView('view-settings');
    }

    // --- Interview Execution ---
    function renderStartList() { document.getElementById('start-project-list').innerHTML = projects.map((p, i) => `<button class="btn-main" onclick="runInterview(${i})">${p.name}</button>`).join('') || '<p>No projects.</p>'; }

    function runInterview(idx) {
        const active = projects[idx];
        activeProjectQuestions = active.questions.filter(q => !q.disabled);
        if(activeProjectQuestions.length === 0) return alert("No enabled questions in this project!");
        
        document.getElementById('active-p-name').innerText = active.name;
        document.getElementById('interview-questions').innerHTML = activeProjectQuestions.map((q, i) => {
            let input = `<textarea class="ans-in" data-idx="${i}" placeholder="Notes..."></textarea>`;
            if(q.type !== 'text') input = q.options.map(opt => `<label class="choice-row"><input type="${q.type}" name="q${i}" value="${opt}" class="ans-in" data-idx="${i}"> <span>${opt}</span></label>`).join('');
            return `<div class="card"><b>${i+1}. ${q.text}</b><br>${input}</div>`;
        }).join('');
        showView('view-interview');
    }

    function finishInterview() {
        const activeName = document.getElementById('active-p-name').innerText;
        const dur = document.getElementById('timer-display').innerText;
        let txt = `REPORT: ${activeName}\nDATE: ${new Date().toLocaleString()}\nDURATION: ${dur}\n\n`;
        activeProjectQuestions.forEach((q, i) => {
            txt += `Q${i+1}: ${q.text}\n`;
            if(q.type === 'text') txt += `A: ${document.querySelector(`textarea[data-idx="${i}"]`).value}\n`;
            else { const sel = Array.from(document.querySelectorAll(`input[data-idx="${i}"]:checked`)).map(e => e.value); txt += `A: ${sel.join(', ') || 'None'}\n`; }
            txt += `-------------------\n`;
        });
        reports.push({ name: activeName, date: new Date().toLocaleString(), content: txt });
        localStorage.setItem('ct_reports', JSON.stringify(reports));
        downloadFile(new Blob([txt], {type:'text/plain'}), `Record_${activeName}.txt`);
        if(audioChunks.length > 0) downloadFile(new Blob(audioChunks, {type:'audio/webm'}), `Audio_${activeName}.webm`);
        showView('view-thanks');
    }

    // --- Helpers ---
    function toggleOptionsUI() { document.getElementById('options-setup').style.display = (document.getElementById('q-type').value !== 'text') ? 'block' : 'none'; }
    function addOptionInput(val = '') { const div = document.createElement('div'); div.innerHTML = `<input type="text" class="opt-val" value="${val}" placeholder="Option">`; document.getElementById('options-list').appendChild(div); }
    function downloadFile(blob, name) { const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name; a.click(); }
    function renderReports() { document.getElementById('reports-list').innerHTML = reports.map((r, i) => `<div class="card" style="display:flex; justify-content:space-between; align-items:center;"><b>${r.name}</b><button onclick="downloadFile(new Blob([reports[${i}].content],{type:'text/plain'}),'Record_'+reports[${i}].name+'.txt')" class="btn-success" style="width:auto;">Get</button></div>`).join('') || '<p>No records.</p>'; }
    function renderLogs() { document.getElementById('logs-list').innerHTML = logs.map(l => `<div class="card" style="font-size:0.8rem; padding:10px;">${l}</div>`).join(''); }
    function renderSummary() { document.getElementById('summary-content').innerHTML = `<div class="card">Projects: ${projects.length}<br>Records: ${reports.length}</div>`; }
    function deleteProject(i) { if(confirm("Delete?")) { projects.splice(i,1); localStorage.setItem('ct_projects', JSON.stringify(projects)); renderProjectList(); } }
</script>
</body>
</html>
